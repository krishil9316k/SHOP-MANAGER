<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KRISHIL edu hub – Shop Manager</title>
<meta name="theme-color" content="#0b2a5b">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#1b1f2a;--mu:#6b7385;--pr:#4f46e5;--ok:#16a34a;--bad:#dc2626;--bd:#e3e6ee;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12141b;--card:#1b1e28;--tx:#eceef5;--mu:#98a0b5;--bd:#2a2f3d;--pr:#818cf8}}
:root[data-theme="dark"]{--bg:#12141b;--card:#1b1e28;--tx:#eceef5;--mu:#98a0b5;--bd:#2a2f3d;--pr:#818cf8}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:70px}
header{padding:14px 16px;font-weight:700;font-size:18px}header small{display:block;color:var(--mu);font-weight:400;font-size:12px}
main{max-width:720px;margin:auto;padding:0 12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px}
.stat b{display:block;font-size:20px}.stat span{color:var(--mu);font-size:12px}
.ok{color:var(--ok)}.bad{color:var(--bad)}.mu{color:var(--mu);font-size:13px}
input,select,button{font:inherit;padding:9px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);width:100%}
button{background:var(--pr);color:#fff;border:0;font-weight:600;cursor:pointer}
button.s{width:auto;padding:4px 10px;background:var(--bd);color:var(--tx)}
.row{display:flex;gap:8px;margin-bottom:8px}.row>*{flex:1;min-width:0}
.li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--bd)}
h3{margin:0 0 8px;font-size:15px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{background:none;color:var(--mu);border-radius:0;padding:12px 2px;font-size:12px}nav button.on{color:var(--pr)}
.bars{display:flex;align-items:flex-end;gap:6px;height:90px}.bars div{flex:1;text-align:center;font-size:10px;color:var(--mu)}
.bars i{display:block;background:var(--pr);border-radius:4px 4px 0 0;min-height:2px}
.low{color:var(--bad);font-weight:600}
@media print{body>*:not(#bill){display:none!important}#bill{position:static!important;background:none!important}#bill .row{display:none}}
</style></head><body>
<header>KRISHIL edu hub<small>Shop Manager · sales, expenses, stock &amp; profit</small></header>
<div id="auth" style="position:fixed;inset:0;background:var(--bg);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px"><div class="card" style="max-width:380px;width:100%;margin:0" id="abox"><p style="text-align:center">Connecting…</p></div></div>
<main id="v"></main>
<nav id="nav"></nav>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const loc=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4);
const today=()=>loc().toISOString().slice(0,10);
const ino=n=>'₹'+(Math.round(n*100)/100).toLocaleString('en-IN');
const SV={"B&W Copy":1,"Color Copy":5,"B&W Print":1,"Color Print":5,"Scan":5,"Lamination":20,"Spiral Binding":25,"Passport Photo":30,"Other":0};
const CAT=["Rent","Electricity","Paper","Toner/Ink","Salary","Repair","Internet","Other"];
let S={sales:[],exp:[],inv:[],rates:{},meter:[],invs:[],invn:0},tab='home',syncMsg='';
const dl={save:async({filename,data})=>{const t=filename.endsWith('.csv')?'text/csv':filename.endsWith('.json')?'application/json':'text/html';
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:t+';charset=utf-8'}));a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}};
S.rates=S.rates||{};S.meter=S.meter||[];S.invs=S.invs||[];S.invn=S.invn||0;
const rate=k=>S.rates[k]!=null?S.rates[k]:SV[k];
function save(){syncOut();render()}
const id=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const sum=(a,f)=>a.reduce((t,x)=>t+f(x),0);
const amt=x=>x.q*x.r;
function pick(p){return {sales:S.sales.filter(x=>x.d.startsWith(p)),exp:S.exp.filter(x=>x.d.startsWith(p))}}

function render(){
 $('#nav').innerHTML=[['home','Home'],['sale','Sales'],['exp','Expenses'],['inv','Stock'],['more','More']].map(t=>`<button class="${tab==t[0]?'on':''}" onclick="tab='${t[0]}';render()">${t[1]}</button>`).join('');
 $('#v').innerHTML=({home,sale,exp,inv,more})[tab]();
 if(tab=='sale'){autoRate();fillSel()}
}
function home(){
 const t=pick(today()),m=pick(today().slice(0,7));
 const ts=sum(t.sales,amt),te=sum(t.exp,x=>x.a),ms=sum(m.sales,amt),me=sum(m.exp,x=>x.a),tc=sum(t.sales,x=>(x.cost||0)*x.q),mc=sum(m.sales,x=>(x.cost||0)*x.q);
 const dues=S.sales.filter(x=>!x.p),low=S.inv.filter(x=>x.q<=x.m);
 let days=[];for(let i=6;i>=0;i--){const d=new Date(loc().getTime()-i*864e5).toISOString().slice(0,10);days.push([d.slice(8),sum(S.sales.filter(x=>x.d==d),amt)])}
 const mx=Math.max(1,...days.map(x=>x[1]));
 const by={};m.sales.forEach(x=>{const k=x.st?'Stationery':x.s;by[k]=(by[k]||0)+amt(x)});
 const top=Object.entries(by).sort((a,b)=>b[1]-a[1]);
 return `<div class="grid">
 <div class="stat"><span>Today sales</span><b>${ino(ts)}</b></div>
 <div class="stat"><span>Today profit</span><b class="${ts-te-tc>=0?'ok':'bad'}">${ino(ts-te-tc)}</b></div>
 <div class="stat"><span>Month sales</span><b>${ino(ms)}</b></div>
 <div class="stat"><span>Month profit</span><b class="${ms-me-mc>=0?'ok':'bad'}">${ino(ms-me-mc)}</b></div></div>
 <div class="card" style="margin-top:12px"><h3>Last 7 days</h3><div class="bars">${days.map(x=>`<div><i style="height:${x[1]/mx*70}px"></i>${x[0]}</div>`).join('')}</div></div>
 <div class="card"><h3>Top services this month</h3>${top.length?top.map(x=>`<div class="li"><span>${esc(x[0])}</span><b>${ino(x[1])}</b></div>`).join(''):'<p class="mu">No sales yet.</p>'}</div>
 <div class="card"><h3>Pending dues: ${ino(sum(dues,amt))}</h3>${dues.length?'<p class="mu">Open the Sales tab to collect.</p>':'<p class="mu">None.</p>'}
 <h3>Low stock</h3>${low.length?low.map(x=>`<div class="low">${esc(x.n)}: ${x.q}${esc(x.u)}</div>`).join(''):'<p class="mu">All good.</p>'}</div>
 <button onclick="exportCsv()">Download CSV report</button>
 <div class="row" style="margin-top:8px"><button onclick="backup()">Backup data</button><button style="background:#6b7385" onclick="document.getElementById('rf').click()">Import backup</button></div>
 <input id="rf" type="file" accept=".json" style="display:none" onchange="importData(this)">
 <button style="background:#dc2626;margin-top:8px" onclick="FB.out()">Sign out</button>
 <p class="mu" style="text-align:center">${esc(syncMsg)}${window.userEmail?' · '+esc(window.userEmail):''}</p>`;
}
function sale(){
 const t=S.sales.filter(x=>x.d==today()).reverse(),dues=S.sales.filter(x=>!x.p);
 return `<div class="card"><h3>New sale</h3>
 <select id="s" onchange="autoRate(1)">${Object.keys(SV).map(k=>`<option>${esc(k)}</option>`).join('')}</select>
 <div class="row" style="margin-top:8px"><input id="q" type="number" placeholder="Qty" value="1" min="1"><input id="r" type="number" step="any" placeholder="Rate ₹"></div>
 <div class="row"><input id="c" placeholder="Customer (optional)"><select id="m"><option>Cash</option><option>UPI</option><option>Credit</option></select></div>
 <button onclick="addSale()">Add sale</button></div>
 <div class="card"><h3>Sell stationery</h3><input id="sq" placeholder="Search item" oninput="fillSel()"><select id="si" onchange="stPrice()" style="margin:8px 0"></select>
 <div class="row"><input id="sqt" type="number" value="1" min="1"><input id="spr" type="number" step="any" placeholder="Rate ₹"></div>
 <div class="row"><input id="sc" placeholder="Customer (optional)"><select id="sm"><option>Cash</option><option>UPI</option><option>Credit</option></select></div>
 <button onclick="sellSt()">Sell item</button></div>
 ${dues.length?`<div class="card"><h3>Dues to collect</h3>${dues.map(x=>`<div class="li"><span>${esc(x.c||'Customer')} · ${esc(x.s)} ×${x.q}<br><span class="mu">${x.d}</span></span><span><b>${ino(amt(x))}</b> <button class="s" onclick="paid('${x.id}')">Paid</button></span></div>`).join('')}</div>`:''}
 <div class="card"><h3>Today (${ino(sum(t,amt))})</h3>${t.map(x=>`<div class="li"><span>${esc(x.s)} ×${x.q} <span class="mu">${esc(x.m)}</span></span><span>${ino(amt(x))} <button class="s" onclick="bill([S.sales.find(y=>y.id=='${x.id}')])">🧾</button> <button class="s" onclick="del('sales','${x.id}')">✕</button></span></div>`).join('')||'<p class="mu">No sales today.</p>'}</div>
 <div class="card"><h3>Default rates (₹ per unit)</h3>${Object.keys(SV).map((k,i)=>`<div class="li"><span>${esc(k)}</span><input type="number" step="any" style="width:90px" value="${rate(k)}" onchange="setRate(${i},this.value)"></div>`).join('')}</div>`;
}
function setRate(i,v){S.rates[Object.keys(SV)[i]]=+v||0;syncOut()}

function recBody(a){const x=a[0],t=sum(a,amt),dd=sum(a.filter(y=>!y.p),amt);
return `<div style="text-align:center"><img src="${LOGO}" alt="${SHOP}" style="width:210px;max-width:100%"><br>Xerox · Print · Scan · Lamination<br><span style="font-size:12px">Bill #${x.id.slice(-5).toUpperCase()} · ${x.d}</span></div><hr>
<div>Customer: ${esc(x.c||'Walk-in')}</div><table style="width:100%;margin:8px 0">${a.map(y=>`<tr><td>${esc(y.s)}</td><td align="right">${y.q} ×${y.r}</td><td align="right">${ino(amt(y))}</td></tr>`).join('')}</table><hr>
<div style="display:flex;justify-content:space-between"><b>Total</b><b>${ino(t)}</b></div><div>${dd?'Due: '+ino(dd):'Paid ('+esc(x.m)+')'}</div><p style="text-align:center;margin:10px 0 0">Thank you! Visit again.</p>`}
let BA=[];
function bill(a){if(!a[0])return;BA=a;
 const o=document.createElement('div');o.id='bill';o.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:9;overflow:auto;padding:16px';
 o.innerHTML=`<div style="background:#fff;color:#000;max-width:340px;margin:auto;padding:16px;border-radius:10px;font-size:14px">${recBody(a)}</div>
 <div class="row" style="max-width:340px;margin:10px auto"><button onclick="try{window.print()}catch(e){}">Print</button>${dl?`<button onclick="dlBill()">Save</button>`:''}<button style="background:#6b7385" onclick="this.closest('#bill').remove()">Close</button></div>`;
 document.body.appendChild(o)}
async function dlBill(){try{await dl.save({filename:'bill-'+BA[0].id.slice(-5)+'.html',data:`<!DOCTYPE html><meta name="viewport" content="width=device-width"><body style="font-family:sans-serif;max-width:340px;margin:20px auto">${recBody(BA)}</body>`})}catch(e){}}
let CN=[];
function billCust(i){const all=S.sales.filter(x=>x.c==CN[i]);let a=all.filter(x=>!x.p);
 if(!a.length)a=all.filter(x=>x.d==today());
 if(!a.length){const d=all.map(x=>x.d).sort().pop();a=all.filter(x=>x.d==d)}
 a.length?bill(a):toast('No sales found for this customer')}
function addMeter(){const r=+$('#mr').value;if(!(r>0))return toast('Enter meter reading');const d=$('#md').value||today();
 S.meter=S.meter.filter(x=>x.d!=d);S.meter.push({id:id(),d,r});save()}
const A1=['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'],A2=['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
const w99=n=>n<20?A1[n]:A2[Math.floor(n/10)]+(n%10?' '+A1[n%10]:'');
const w999=n=>(n>99?A1[Math.floor(n/100)]+' Hundred'+(n%100?' ':''):'')+(n%100?w99(n%100):'');
function words(n){n=Math.round(n);if(!n)return 'Zero';let o='';const cr=Math.floor(n/1e7),l=Math.floor(n%1e7/1e5),th=Math.floor(n%1e5/1e3),r=n%1e3;
 if(cr)o+=w999(cr)+' Crore ';if(l)o+=w99(l)+' Lakh ';if(th)o+=w99(th)+' Thousand ';if(r)o+=w999(r);return o.trim()}
let DOCH='',DOCN='';
function showDoc(h,n){DOCH=h;DOCN=n;const o=document.createElement('div');o.id='bill';o.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:9;overflow:auto;padding:16px';
 o.innerHTML=`<div style="background:#fff;color:#000;max-width:560px;margin:auto;padding:16px;border-radius:10px;font-size:14px">${h}</div>
 <div class="row" style="max-width:560px;margin:10px auto"><button onclick="try{window.print()}catch(e){}">Print</button>${dl?`<button onclick="dlDoc()">Save</button>`:''}<button style="background:#6b7385" onclick="this.closest('#bill').remove()">Close</button></div>`;document.body.appendChild(o)}
async function dlDoc(){try{await dl.save({filename:DOCN+'.html',data:`<!DOCTYPE html><meta name="viewport" content="width=device-width"><body style="font-family:sans-serif;max-width:600px;margin:20px auto">${DOCH}</body>`})}catch(e){}}
function invHtml(v){return `<div style="display:flex;justify-content:space-between"><div><img src="${LOGO}" alt="${SHOP}" style="width:180px;max-width:100%"><br>Xerox · Print · Scan · Lamination</div><div style="text-align:right"><b>INVOICE</b><br>${v.no}<br>${v.d}</div></div><hr>
<div><b>Bill to:</b> ${esc(v.c)}${v.addr?'<br>'+esc(v.addr):''}<br><span style="font-size:12px">Period: ${v.f||'start'} to ${v.t||'today'}</span></div>
<table style="width:100%;margin:10px 0;border-collapse:collapse"><tr style="border-bottom:1px solid #999"><th align="left">Item</th><th align="right">Qty</th><th align="right">Rate</th><th align="right">Amount</th></tr>
${v.lines.map(l=>`<tr><td>${esc(l.s)}</td><td align="right">${l.q}</td><td align="right">${l.r}</td><td align="right">${ino(l.q*l.r)}</td></tr>`).join('')}</table><hr>
<div style="text-align:right">Subtotal: ${ino(v.sub)}<br>${v.dp?`Discount (${v.dp}\%): −${ino(v.disc)}<br>`:''}${v.gp?`GST (${v.gp}\%):${ino(v.gst)}<br>`:''}<b style="font-size:17px">Total: ${ino(v.total)}</b></div>
<p style="font-size:12px">Amount in words: Rupees ${words(v.total)} only</p><p><b>${v.paid?'PAID':'PAYMENT DUE'}</b></p><p style="text-align:center;margin:0">Thank you for your business!</p>`}
function mkInv(){const c=$('#ic').value,f=$('#if').value,t=$('#it').value;if(!c)return toast('Choose a customer');
 const a=S.sales.filter(x=>x.c==c&&(!f||x.d>=f)&&(!t||x.d<=t));if(!a.length)return toast('No items in this date range');
 const g={};a.forEach(x=>{const k=x.s+'|'+x.r;g[k]=g[k]||{s:x.s,r:x.r,q:0};g[k].q+=x.q});
 const sub=sum(a,amt),dp=+$('#ivd').value\vert{}\vert{}0,gp=+$('#ivg').value||0,disc=sub*dp/100,tx=sub-disc,gst=tx*gp/100;
 S.invn=(S.invn||0)+1;const v={id:id(),no:'KEH-'+String(S.invn).padStart(3,'0'),d:today(),c,addr:$('#ia').value.trim(),f,t,lines:Object.values(g),sub,dp,disc,gp,gst,total:tx+gst,sales:a.map(x=>x.id),paid:false};
 S.invs.push(v);save();showInv(v.id)}
function showInv(i){const v=S.invs.find(x=>x.id==i);if(v)showDoc(invHtml(v),v.no)}
function invPaid(i){const v=S.invs.find(x=>x.id==i);if(!v)return;v.paid=true;S.sales.forEach(x=>{if(v.sales.includes(x.id)){x.p=true;if(x.m=='Credit')x.m='Cash'}});save()}
function invCard(){const first=today().slice(0,8)+'01';
 return `<div class="card"><h3>Invoice builder (schools / bulk)</h3>

 if(m!==metaPrev){metaPrev=m;FB.setMeta(JSON.parse(m)).catch(e=>{syncMsg='Sync error: '+(e.code||'')})}
